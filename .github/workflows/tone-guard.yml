name: tone-guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test tone-guard controls
        run: python tests/test_tone_guard.py

      - name: Run tone-guard
        run: |
          python scripts/tone_guard.py \
            --repo-root . \
            --waivers .github/tone-guard-waivers.json \
            public/ CONTRIBUTING.md README.md 2>&1
